services:
  app:
    container_name: X42-IoT-ESP32-CAMandRADAR-TurtleTracker
    image: ghcr.io/danix42/x42-iot-esp32-camandradar-turtletracker:latest
    pull_policy: always
    network_mode: host
    volumes:
      - /opt/X42-IoT-ESP32-CAMandRADAR-TurtleTracker/data:/data
    restart: unless-stopped
    privileged: true
    security_opt:
      - apparmor=unconfined
    environment:
      TZ: Europe/Vienna
      DATABASE_PATH: /data/turtle_tracker.db
      MOTION_CROPS_PATH: /data/motion_crops
